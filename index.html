<!DOCTYPE html>
<html lang="es">
<head>
<script>window.SKYNET_PROD=true;window.SKYNET_API="https://skynet-red.onrender.com"</script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0B4F8A">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYNET · La red social</title>
<link rel="icon" id="favi" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --azul:#0B4F8A;--azul2:#1867B0;--verde:#14A38B;--verdeo:#0E8571;--ambar:#E0A21A;--petroleo:#1E3A4C;
 --fondo:#F4F8FB;--blanco:#FFFFFF;--txt:#1C2B39;--suave:#5D6B78;--borde:#DCE5EE;--fa:#E8F1FA;--fv:#E3F6F2;
 --rojo:#C0392B;--fr:#FDECEA;--fam:#FFF4DC;
 --hex:circle(50% at 50% 50%);
 --ig:linear-gradient(45deg,#E0A21A 0%,#ff7a45 30%,#e8336a 60%,#8a3ab9 100%);
}
/* Versión clásica: colores de Facebook */
body.tema-clasico{--azul:#1877F2;--azul2:#166FE5;--verde:#1877F2;--verdeo:#166FE5;--ambar:#F7B928;--petroleo:#1C1E21;--fondo:#F0F2F5;--txt:#050505;--suave:#65676B;--borde:#CED0D4;--fa:#E7F3FF;--fv:#E7F3FF;--ig:linear-gradient(45deg,#1877F2,#4B9BFF)}
body.tema-clasico .btn.crear{background:#42B72A}body.tema-clasico .btn.crear:hover{background:#36A420}
/* Versión premium: azul y dorado */
body.tema-premium{--azul:#0A2A5E;--azul2:#123D82;--verde:#B8912A;--verdeo:#9A7720;--ambar:#D4AF37;--petroleo:#081A3A;--fondo:#EEF1F7;--txt:#0B1730;--suave:#55607A;--borde:#D9DEEA;--fa:#E6ECF7;--fv:#F7F0DC;--ig:linear-gradient(45deg,#8C6A12,#D4AF37,#F3DC8A,#D4AF37)}
body.tema-premium .rail{background:linear-gradient(180deg,#0A2A5E,#081A3A);color:#F3E6B8;padding-left:10px;border-radius:0 22px 22px 0}
body.tema-premium .rail nav button{color:#E9EEF8}body.tema-premium .rail nav button.on{color:#F3DC8A}
body.tema-premium .rail .yo b,body.tema-premium .rail .pal b{color:#fff}body.tema-premium .rail .yo .suave{color:#C9D2E6}
body.tema-premium .topm,body.tema-premium .bnav{background:#0A2A5E;color:#F3DC8A;border-color:#123D82}
body.tema-premium .topm .pal b{color:#fff}body.tema-premium .topm button{color:#F3DC8A}body.tema-premium .bnav button{color:#E9EEF8}
.prem{display:inline-flex;align-items:center;margin-left:4px;vertical-align:-3px}.prem svg{display:block;filter:drop-shadow(0 1px 1px rgba(120,90,0,.35))}
.premcaja{background:linear-gradient(135deg,#0A2A5E,#081A3A);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.premcaja h3{color:#F3DC8A;font-size:30px}.premcaja li{margin:6px 0}.premcaja .btn{background:linear-gradient(135deg,#F3DC8A,#B8912A);color:#1B1400}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--txt);font-family:'Public Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;color-scheme:light}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;line-height:1.05}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:#fff;border:1.5px solid var(--borde);border-radius:12px;padding:11px 13px;width:100%;color-scheme:light}
input:focus,select:focus,textarea:focus{border-color:var(--verde);outline:none}
textarea{resize:vertical}
input[type=checkbox],input[type=radio]{width:19px;height:19px;accent-color:var(--verde);flex:none;margin:1px 0 0;padding:0}
label.l{display:block;font-weight:600;font-size:13px;color:var(--suave);margin:12px 0 5px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
a.btn{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px;background:var(--verde);color:#fff}
.btn:hover{background:var(--verdeo)}
.btn.az{background:var(--azul)}.btn.az:hover{background:var(--azul2)}
.btn.sec{background:#fff;color:var(--azul);border:1.5px solid var(--borde)}.btn.sec:hover{border-color:var(--azul);background:#fff}
.btn.rojo{background:var(--rojo)}
.btn.chico{padding:7px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.suave{color:var(--suave)}
.peq{font-size:13px}

/* hexágonos: el sello de la red, tomado del logo */
.hx{clip-path:var(--hex);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none;overflow:hidden;font-family:'Barlow Condensed';letter-spacing:.5px}
.hx img{width:100%;height:100%;object-fit:cover}
.anillo{clip-path:var(--hex);padding:3px;background:var(--ig);flex:none}
.anillo.visto{background:var(--borde)}
.cmacc{display:flex;gap:12px;margin-top:3px}.cmacc button{background:none;border:0;padding:0;font-size:12.5px;font-weight:600;color:var(--suave)}.cmacc button:hover{color:var(--azul);text-decoration:underline}
.cmbox{display:flex;align-items:center;gap:8px}.cmbox input{flex:1}.cmbox .env{width:40px;height:40px;border-radius:50%;border:0;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.cmbox .env svg{width:19px;height:19px}
.bb .macc{display:none;gap:10px;margin-top:4px}.bb.mio:hover .macc,.bb.mio:focus-within .macc,.bb.mio.sel .macc{display:flex}.bb .macc button{background:none;border:0;color:inherit;opacity:.85;font-size:12px;font-weight:700;padding:0;text-decoration:underline}
.bb.borr{font-style:italic;opacity:.6}
.cfg{list-style:none;margin:0;padding:0}.cfg li{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--borde)}.cfg li>div{flex:1}.cfg b{display:block;font-size:16px;font-weight:600}.cfg span{color:var(--suave);font-size:14px}
.cbx{appearance:none;-webkit-appearance:none;width:30px!important;height:30px!important;border-radius:8px;border:2px solid #9AA4B1;background:#fff;flex:none;cursor:pointer;display:grid;place-content:center;margin-top:2px!important}
.cbx:checked{background:var(--verde);border-color:var(--verde)}.cbx:checked::after{content:"";width:13px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.cfgtit{padding:18px 18px 6px;font-size:13px;font-weight:700;color:var(--azul);text-transform:none}
.permiso{background:#fff;border-radius:26px;padding:26px 22px 14px;text-align:center;max-width:380px;margin:auto}.permiso .camp{color:var(--azul);margin-bottom:10px}.permiso .camp svg{width:44px;height:44px}.permiso p{font-size:17px;margin:0 0 14px}.permiso button{display:block;width:100%;background:none;border:0;padding:14px;font-size:19px;font-weight:700;color:var(--txt);border-radius:14px}.permiso button:hover{background:var(--fondo)}
.rxpick{position:fixed;z-index:80;background:#fff;border-radius:999px;box-shadow:0 8px 28px rgba(28,43,57,.25);padding:6px 8px;display:flex;gap:2px;animation:rxin .18s ease-out}
.rxpick button{background:none;border:0;font-size:30px;line-height:1;padding:4px 5px;cursor:pointer;transition:transform .12s;border-radius:50%}
.rxpick button:hover,.rxpick button:focus-visible{transform:scale(1.35) translateY(-4px)}
@keyframes rxin{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.rxpick{animation:none}.rxpick button{transition:none}}
.rxres{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--suave);background:none;border:0;padding:4px 0;cursor:pointer}
.rxres .em{display:inline-flex}.rxres .em span{font-size:17px;margin-right:-4px;filter:drop-shadow(0 0 1px #fff)}
.vlado .emo{font-size:26px;line-height:1}
.anillo>.blanco{clip-path:var(--hex);background:#fff;padding:3px}
.sello svg{display:block}.sello{display:inline-flex;width:17px;height:17px;vertical-align:-3px;margin-left:3px}
.sello svg{width:17px;height:17px}

/* marca */
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0}
.marca svg{width:40px;height:40px;flex:none}
.marca .pal{display:flex;flex-direction:column;line-height:.86;text-align:left}
.marca b{font-family:'Barlow Condensed';font-weight:800;font-size:24px;color:var(--petroleo);letter-spacing:.5px}
.marca i{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-size:15px;color:var(--ambar);letter-spacing:3px}

/* ---------- Portada ---------- */
.portada{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr;background:#fff}
.izq{background:linear-gradient(160deg,var(--azul) 0%,var(--petroleo) 75%);color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:70px;padding:40px}
.izq canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.izq>*{position:relative}
.titular{max-width:380px}
.titular .marca b{color:#fff}
.lema{font-family:'Barlow Condensed';font-weight:800;font-size:clamp(44px,5vw,76px);line-height:.95;margin:26px 0 0;letter-spacing:-.3px}
.lema2{font-size:17px;color:#d6e6f2;margin:16px 0 0;max-width:32ch}
.cifrasP{display:flex;gap:26px;margin-top:28px}
.cifrasP b{display:block;font-family:'Barlow Condensed';font-size:34px;color:var(--ambar);line-height:1}
.cifrasP span{font-size:13px;color:#cfe0ec}
.escena{position:relative;width:300px;height:600px;flex:none}
.cel{position:absolute;inset:0;border-radius:44px;background:#0f2230;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 0 0 2px #2f4a5c}
.cel:before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:90px;height:24px;border-radius:14px;background:#0f2230;z-index:3}
.pant{width:100%;height:100%;border-radius:34px;background:#fff;overflow:hidden;position:relative;color:var(--txt)}
.pant .tope{position:absolute;top:0;left:0;right:0;z-index:2;background:#fff;padding:48px 14px 8px;height:92px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--borde)}
.pant .tope .marca svg{width:26px;height:26px}.pant .tope .marca b{font-size:16px}.pant .tope .marca i{font-size:10px;letter-spacing:2px}
.pant .rueda{position:absolute;top:92px;padding-bottom:52px;left:0;right:0;animation:rodar 26s linear infinite}
@keyframes rodar{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.mh{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--borde)}
.mh .hist span{font-size:10px;width:48px}
.mp{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--borde);font-size:12.5px;line-height:1.35}
.mp b{font-size:12.5px}
.mp .lz{border-radius:12px;color:#fff;font-family:'Barlow Condensed';font-weight:700;font-size:19px;line-height:1;padding:22px 12px;text-align:center;margin-top:6px;white-space:pre-wrap}
.mp .ac{display:flex;gap:16px;color:var(--suave);margin-top:6px;font-size:11px}.mp .ac svg{width:14px;height:14px;vertical-align:-2px}
.pant .base{position:absolute;bottom:0;left:0;right:0;height:52px;background:#fff;border-top:1px solid var(--borde);display:flex;justify-content:space-around;align-items:center;color:var(--suave);z-index:2}
.pant .base svg{width:20px;height:20px}
.pant .base .hb{width:36px;height:36px;clip-path:var(--hex);background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center}
.burb{position:absolute;background:#fff;color:var(--txt);border-radius:16px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.28);font-size:13px;width:240px;opacity:0;animation:aparece 12s infinite;z-index:4}
.burb b{display:block;font-size:13px}
.burb .ico{width:34px;height:34px;clip-path:var(--hex);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.burb .ico svg{width:17px;height:17px}
.b1{left:-46px;top:150px;animation-delay:0s}.b2{right:-46px;top:300px;animation-delay:4s}.b3{left:-46px;top:450px;animation-delay:8s}
@keyframes aparece{0%{opacity:0;transform:translateY(14px) scale(.95)}4%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-10px)}}
.der{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;background:var(--fondo)}
.caja{width:100%;max-width:380px;background:#fff;border:1px solid var(--borde);border-radius:22px;padding:30px 30px 24px}
.caja .marca{justify-content:center;margin-bottom:6px}
.caja .marca svg{width:52px;height:52px}.caja .marca b{font-size:30px}.caja .marca i{font-size:18px}
.caja .lema3{text-align:center;color:var(--suave);font-size:15px;margin:4px 0 18px}
.caja input{background:var(--fondo);margin-bottom:8px}
.sep{display:flex;align-items:center;gap:12px;color:var(--suave);font-size:13px;font-weight:600;margin:16px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--borde)}
.caja2{width:100%;max-width:380px;background:#fff;border:1px solid var(--borde);border-radius:22px;padding:18px 20px;margin-top:12px;text-align:center}
.demos{display:flex;justify-content:space-between;gap:4px;margin-top:12px}
.demos button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--suave);width:64px;padding:0}
.demos button:hover{color:var(--azul)}
.demos button:hover .anillo{transform:scale(1.06)}
.demos .anillo{transition:transform .15s}
.titularM{display:none;color:#fff;text-align:center;max-width:380px;margin-bottom:20px}.titularM h1{font-family:'Barlow Condensed';font-weight:800;font-size:44px;line-height:.95;margin:14px 0 8px}.titularM p{color:#d6e6f2;margin:0;font-size:15px}.titularM .marca{justify-content:center}.titularM .marca b{color:#fff}
.tiendas{display:flex;gap:8px;justify-content:center;margin-top:16px}
.tiendas span{background:var(--txt);color:#fff;border-radius:10px;padding:7px 14px;font-size:11px;line-height:1.15;text-align:left}
.tiendas span b{display:block;font-size:14px}
.pieP{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:18px;font-size:12.5px;color:var(--suave);max-width:380px}
.pieP button{background:none;border:0;padding:0;color:var(--suave);font-size:12.5px}
.pieP button:hover{text-decoration:underline}
@media(max-width:1100px){.titular{display:none}
 .portada{display:flex;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(165deg,var(--azul) 0%,var(--azul2) 45%,var(--petroleo) 100%)}
 .izq{order:2;position:static;background:none;padding:10px 10px 50px}.izq canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
 .escena{transform:scale(.82);margin:-50px 0;z-index:1}.burb{display:none}
 .der{order:1;position:relative;z-index:1;background:none;padding:28px 16px 10px}
 .titularM{display:block!important}
 .caja,.caja2{box-shadow:0 24px 60px rgba(0,0,0,.35);border-color:transparent}
 .pieP,.pieP button{color:#cfe0ec}
}
/* ---------- App ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,620px) 330px;justify-content:center;gap:0 28px;max-width:1290px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 10px 18px 0}
.rail nav{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;gap:15px;background:none;border:0;padding:12px 14px;border-radius:999px;font-size:17px;font-weight:500;text-align:left;position:relative}
.rail nav button:hover{background:#fff}
.rail nav button.on{font-weight:800;color:var(--azul)}
.rail nav button.on svg{stroke-width:2.5}
.punto{position:absolute;left:30px;top:7px;min-width:18px;height:18px;border-radius:9px;background:var(--rojo);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--fondo)}
.rail .publicar{margin:16px 10px 0 0;padding:15px;font-size:17px}
.yo{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:999px;background:none;border:0;text-align:left;width:100%}
.yo:hover{background:#fff}
.yo>div:not(.hx){flex:1;min-width:0}
.yo b,.yo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yo span{font-size:13px;color:var(--suave)}
.centro{background:#fff;border-left:1px solid var(--borde);border-right:1px solid var(--borde);min-height:100vh;padding-bottom:80px}
.cab{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde)}
.cab h1{font-size:26px;color:var(--azul);padding:14px 18px 10px}
.pest{display:flex;overflow-x:auto;scrollbar-width:none}.pest::-webkit-scrollbar{display:none}.pest button{flex:0 0 auto}
.pest button{flex:1;background:none;border:0;padding:14px 6px;font-weight:600;color:var(--suave);position:relative;font-size:15px}
.pest button:hover{background:var(--fondo)}
.pest button.on{color:var(--txt);font-weight:800}
.pest button.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:56px;height:4px;border-radius:4px;background:var(--verde)}
.lateral{padding:14px 0 30px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.bloque{background:#fff;border:1px solid var(--borde);border-radius:18px;margin-bottom:14px;overflow:hidden}
.bloque h3{font-size:22px;padding:14px 16px 6px;color:var(--txt)}
.fil{display:flex;align-items:center;gap:11px;padding:10px 16px;width:100%;background:none;border:0;text-align:left}
button.fil:hover{background:var(--fondo)}
.fil .t{flex:1;min-width:0}
.fil .t b{display:block;font-size:14.5px}
.fil .t span{font-size:13px;color:var(--suave);display:block}
.buscar{position:relative}
.buscar svg{position:absolute;left:14px;top:12px;width:19px;height:19px;color:var(--suave)}
.buscar input{border-radius:999px;padding-left:42px;background:var(--fondo);border-color:transparent}
.buscar input:focus{background:#fff;border-color:var(--verde)}

/* historias */
.historias{display:flex;gap:14px;overflow-x:auto;padding:14px 18px;border-bottom:1px solid var(--borde);scrollbar-width:none}
.historias::-webkit-scrollbar{display:none}
.hist{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;flex:none;padding:0}
.hist span{font-size:12px;width:70px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mas{position:relative}
.mas i{position:absolute;right:-2px;bottom:2px;width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-style:normal;font-weight:800;font-size:16px;line-height:1}

/* redactor */
.redactor{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--borde)}
.redactor textarea{border:0;padding:8px 0;font-size:19px;min-height:56px;resize:none}
.redactor textarea:focus{border:0}
.herr{display:flex;align-items:center;flex-wrap:wrap;gap:4px;border-top:1px solid var(--borde);padding-top:8px;margin-top:4px}
.herr .ib{color:var(--verde)}
.ib{background:none;border:0;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--suave)}
.ib:hover{background:var(--fv);color:var(--verdeo)}
.ib svg{width:20px;height:20px}
.colores{display:flex;gap:6px;margin:8px 0}
.colores button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--borde)}
.colores button.on{box-shadow:0 0 0 2.5px var(--txt)}

/* publicaciones */
.pub{display:flex;gap:12px;padding:14px 18px 6px;border-bottom:1px solid var(--borde)}
.pub:hover{background:#fbfdfe}
.pub .cuerpo{flex:1;min-width:0}
.quien{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.quien button{background:none;border:0;padding:0;font-weight:800;font-size:15px}
.quien button:hover{text-decoration:underline}
.quien .suave{font-size:14px}

function enviarOferta(){

 const t=norm(o.cargo+' '+o.desc+' '+o.req+' '+o.pago),al=[];

 '<h3 style="font-size:22px">Compras y regalos</h3><p>Solo venden dentro de la red las empresas verificadas con plan activo. Una empresa nueva puede vender hasta '+pesos(S.cfg.limNueva)+' en sus primeros '+S.cfg.diasNueva+' días, se le paga '+S.cfg.diasPago+' días después de cada entrega y su tienda se congela con '+S.cfg.maxRecl+' reclamos. Todo pago se hace con Bold dentro de SkyNet Genesis, que guarda el dinero hasta que el comprador confirma que recibió; si hay un reclamo, Moderación decide y puede devolver el dinero. Nunca pagues por fuera. Los regalos a creadores no se devuelven; el '+(100-S.cfg.comRegalo)+' % es para el creador.</p><h3 style="font-size:22px">Sello azul y contenido sensible</h3><p>El sello azul se ve cuando la persona demostró su identidad con su documento y una selfie y tiene activo el plan Verificado o Premium; esas fotos se borran apenas se decide. Las empresas verifican su NIT y a su representante legal, y su sello y su tienda vienen con el plan Empresa verificada. Las fotos que pueden tener desnudos o violencia se muestran difuminadas, con aviso, hasta que Moderación las revisa. Las cuentas que siguen o escriben a demasiadas personas seguidas se pausan una hora por posible bot.</p><h3 style="font-size:22px">Programa de creadores</h3><p>Desde '+S.cfg.creSeg+' seguidores, sin invitación, te pagamos '+pesos(S.cfg.tarifa1000)+' por cada 1.000 vistas de tus publicaciones. Las vistas falsas o compradas, las cuentas falsas o los acuerdos para inflar números sacan del programa y se pierden las ganancias del mes.</p>'+
 '<h3 style="font-size:22px">Tus datos (Ley 1581 de 2012)</h3><p>SkyNet Genesis es responsable de tus datos y no los vende ni los entrega a terceros, salvo orden escrita de una autoridad. Tu correo, celular y fecha de nacimiento nunca se muestran. Puedes ver, copiar, corregir y borrar tus datos desde tu perfil. Reclamos: contacto@skynetgenesis.com.</p><p class="suave peq">'+PIE+'</p></div>'}

async function grabarVoz(){if(_voz){return pararVoz(true)}if(sancion(S.me))return toast('Tu cuenta está suspendida: puedes leer, pero no enviar mensajes.');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return toast('Este navegador no permite grabar notas de voz.');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const tipo=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';const rec=new MediaRecorder(st,tipo?{mimeType:tipo}:{});const v={rec,st,tr:[],t0:Date.now(),enviar:false,chat:S.chatSel};_voz=v;rec.ondataavailable=e=>{if(e.data.size)v.tr.push(e.data)};

function crearComunidad(){const n=$('#cn1').value.trim(),d=$('#cn2').value.trim(),priv=$('#cn3').value==='priv';if(n.length<4)return toast('Escribe el nombre de la comunidad.');if(d.length<10)return toast('Cuenta un poco de qué se trata.');if(S.C.some(c=>norm(c.nombre)===norm(n)))return toast('Ya existe una comunidad con ese nombre.');const r=revisar(n+' '+d,S.me,null,0).filter(x=>/Palabra|sexual|estafa|dato personal|Correo/.test(x));if(r.length)return toast('No se pudo crear: '+r[0]);const c={id:'c-'+uid(),nombre:n,desc:d,miem:[S.me],mods:[S.me],creador:S.me,priv,sol:[],tono:window._ctono||FONDOS[0],f:ahora(),cat:($('#cn4')||{}).value||''};S.C.push(c);bit(yo().nombre+' creó la comunidad «'+n+'»');S.comSel=c.id;guardarS();cerrarModal();render();toast('Comunidad creada. Invita a tu gente a unirse.')}
function unirse(id){const c=S.C.find(x=>x.id===id);if(c&&c.priv&&!c.miem.includes(S.me)){c.sol=c.sol||[];if(c.sol.includes(S.me))return toast('Ya pediste entrar. Te avisamos cuando te acepten.');c.sol.push(S.me);c.mods.forEach(m=>notif(m,yo().nombre+' pidió entrar a «'+c.nombre+'».','comunidades'));guardarS();render();return toast('Solicitud enviada a quien modera la comunidad.')}return unirse0(id)}
function resolverSol(cid,id,ok){const c=S.C.find(x=>x.id===cid);c.sol=(c.sol||[]).filter(x=>x!==id);if(ok){c.miem.push(id);notif(id,'Te aceptaron en «'+c.nombre+'».','comunidades')}guardarS();render();toast(ok?'Aceptado.':'Solicitud rechazada.')}
function solicitudesCom(c){if(!(c.sol||[]).length||!(c.mods.includes(S.me)||esMod()))return '';return '<div class="seccion"><b>Piden entrar ('+c.sol.length+')</b>'+c.sol.map(id=>'<div class="fila" style="padding:6px 0">'+avatar(U(id),32)+'<b style="flex:1">'+esc(U(id).nombre)+'</b><button class="btn chico" onclick="resolverSol(\''+c.id+'\',\''+id+'\',true)">Aceptar</button><button class="btn sec chico" onclick="resolverSol(\''+c.id+'\',\''+id+'\',false)">Rechazar</button></div>').join('')+'</div>'}
function eventosProx(){const hoy=new Date();hoy.setHours(0,0,0,0);const l=S.P.filter(p=>p.evento&&visible(p)&&new Date(p.evento.dia)>=hoy&&(!p.com||miembro(p.com)||!(S.C.find(c=>c.id===p.com)||{}).cerrada)).sort((a,b)=>a.evento.dia.localeCompare(b.evento.dia)).slice(0,6);
 return '<div class="seccion"><div class="fila"><b style="flex:1;font-size:17px">📅 Próximos eventos</b><button class="btn sec chico" onclick="nuevoEvento(\'\')">Crear evento</button></div>'+(l.length?'<div class="evL">'+l.map(p=>{const d=new Date(p.evento.dia),voy=p.evento.van.includes(S.me);return '<div class="evI"><div class="dia"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('es-CO',{month:'short'})+'</span></div><div style="flex:1;min-width:0"><button class="lnk" onclick="verPub(\''+p.id+'\')"><b>'+esc(p.evento.titulo)+'</b></button><div class="suave peq">'+esc(p.evento.lugar||'')+' · '+p.evento.van.length+' asistirán</div></div><button class="btn chico '+(voy?'sec':'')+'" onclick="asistir(\''+p.id+'\')">'+(voy?'Vas a ir ✓':'Asistiré')+'</button></div>'}).join('')+'</div>':'<p class="suave peq" style="margin:8px 0 0">No hay eventos próximos. Crea uno: tu gente toca «Asistiré» y le recordamos el día antes.</p>')+'</div>'}
function recordarEventos(){if(!S.me)return;const m=new Date();m.setDate(m.getDate()+1);const k=m.toISOString().slice(0,10);S.P.filter(p=>p.evento&&p.evento.dia.slice(0,10)===k&&p.evento.van.includes(S.me)).forEach(p=>{p.evento.rec=p.evento.rec||[];if(!p.evento.rec.includes(S.me)){p.evento.rec.push(S.me);S.N.unshift({id:uid(),para:S.me,t:'Mañana es «'+p.evento.titulo+'»'+(p.evento.lugar?' en '+p.evento.lugar:'')+'. ¡No lo olvides!',f:ahora(),ir:'comunidades',l:false})}});guardarS()}

const EPED={pagado:['Pagado · por despachar','am'],enviado:['Enviado','az'],entregado:['Recibido','ve'],reclamo:['Con reclamo','ro'],devuelto:['Dinero devuelto','gr']};

function vCompras(){const l=S.PED.filter(p=>p.comp===S.me);return '<div class="seccion"><h3 style="font-size:24px;color:var(--azul)">🛒 Mis compras</h3><p class="suave peq">Tu dinero queda guardado en SkyNet Genesis hasta que confirmes que recibiste. Si algo sale mal, toca «Tengo un problema».</p></div>'+

function estadoPed(id,e){const p=S.PED.find(x=>x.id===id);if(!p)return;p.estado=e;p.hist.push([e,ahora()]);if(e==='enviado')notif(p.comp,U(p.vend).nombre+(p.ent==='dom'?' envió tu pedido: ':' tiene listo para recoger: ')+p.nombre+'. Cuando lo tengas, toca «Ya lo recibí».','perfil');if(e==='entregado'){p.pagoEl=new Date(Date.now()+S.cfg.diasPago*864e5).toISOString();notif(p.vend,yo().nombre+' confirmó que recibió '+p.nombre+'. Te pagamos '+pesos(p.total*(100-S.cfg.comTienda)/100)+' el '+fecha(p.pagoEl)+' ('+S.cfg.diasPago+' días después de la entrega).','perfil')}guardarS();render();toast(e==='entregado'?'¡Gracias! Le pagaremos al negocio.':'Listo. Le avisamos al cliente.')}
function reclamoPed(id){modal('<h2>Tengo un problema con mi compra</h2><p class="suave">Moderación revisa tu caso. Mientras tanto el dinero sigue guardado y no se le paga al negocio.</p><textarea id="rcl" rows="3" maxlength="400" placeholder="Ej.: No ha llegado, llegó dañado, no es lo que pedí…"></textarea><div class="fila" style="margin-top:10px"><button class="btn" onclick="enviarReclamo(\''+id+'\')">Enviar reclamo</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>')}
function enviarReclamo(id){const t=$('#rcl').value.trim();if(t.length<8)return toast('Cuéntanos qué pasó.');const p=S.PED.find(x=>x.id===id);p.estado='reclamo';p.recl=t;p.hist.push(['reclamo',ahora()]);notif('mod','PRIORIDAD · Reclamo de compra: '+yo().nombre+' a '+U(p.vend).nombre+' ('+pesos(p.total)+')','moder');revisarCongelar(p.vend);notif(p.vend,yo().nombre+' abrió un reclamo por '+p.nombre+'. Escríbele para resolverlo.','perfil');guardarS();cerrarModal();render();toast('Reclamo enviado. Te avisamos qué decide Moderación.')}
function resolverReclamo(id,devolver){const p=S.PED.find(x=>x.id===id);p.estado=devolver?'devuelto':'entregado';p.hist.push([p.estado,ahora()]);if(!devolver)p.pagoEl=new Date(Date.now()+S.cfg.diasPago*864e5).toISOString();notif(p.comp,devolver?'Te devolvimos '+pesos(p.total)+' de tu compra a '+U(p.vend).nombre+'. Llega por el mismo medio de pago de Bold.':'Revisamos tu reclamo y el pedido se dio por entregado.','perfil');notif(p.vend,devolver?'Moderación devolvió el dinero del pedido «'+p.nombre+'» al cliente.':'Moderación resolvió el reclamo a tu favor: te pagamos el pedido «'+p.nombre+'».','perfil');bit((devolver?'Devolvió ':'Pagó al vendedor ')+pesos(p.total)+' por el reclamo de '+U(p.comp).nombre);guardarS();render();toast('Reclamo resuelto.')}

let idioma='es';try{idioma=localStorage.getItem('sng_idioma')||(/prueba/.test(location.search)?'es':/^en/i.test(navigator.language)?'en':/^pt/i.test(navigator.language)?'pt':'es')}catch(e){}
if(!['es','en','pt'].includes(idioma))idioma='es';
function ponerIdioma(l){idioma=l;try{localStorage.setItem('sng_idioma',l)}catch(e){}document.documentElement.lang=l;location.reload()}
function selIdioma(est){return '<select aria-label="Idioma" class="selIdi"'+(est?' style="'+est+'"':'')+' onchange="ponerIdioma(this.value)">'+[['es','Español'],['en','English'],['pt','Português']].map(([k,t])=>'<option value="'+k+'"'+(idioma===k?' selected':'')+'>'+t+'</option>').join('')+'</select>'}
function traducirTxt(s){const d=IDI[idioma];if(!d)return s;const t=s.trim();if(!t)return s;if(d[t]!==undefined)return s.replace(t,d[t]);for(const [re,f] of (IDIRE[idioma]||[])){const m=t.match(re);if(m)return s.replace(t,f(m))}return s}

const normP=s=>norm(String(s||'')).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),compP=s=>normP(s).replace(/ /g,'');

 const n=' '+normP(nombre)+' ',u=compP(usuario||'');const X=PROTEGIDOS.concat((S.cfg.protExtra||[]).map(x=>[x,'nacional']));
 for(const [p,niv] of X){const pn=normP(p),pc=compP(p);if(pc.length<2)continue;
  if(niv==='generico'||niv==='gobierno'){if(n===' '+pn+' '||new RegExp('^ '+pn+' (oficial|official|colombia|col|co) $').test(n)||(u&&new RegExp('^'+pc+'(_?(oficial|official|co|col|colombia))?$').test(u)))return {p,niv};continue}

function prodDocs(){const out=new Map();
 for(const k of Object.keys(S)){if(!sincP(k))continue;const v=S[k];

function prodAplicar(c,i,d){const k=c+'|'+i;

 const desc=(pl?'Plan '+(PLANES[pl[1]]?PLANES[pl[1]].n:pl[1]):prem?'Plan Premium':(ps[0]||'Compra en SKYNET')).slice(0,110);
